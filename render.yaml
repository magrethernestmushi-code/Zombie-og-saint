services:
  - type: web
    name: zombie-og-saint
    runtime: static
    buildCommand: npm install --ignore-scripts && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
